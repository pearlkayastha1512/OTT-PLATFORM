services:
  postgres:
    image: postgres:16-alpine
    container_name: trueott-postgres
    environment:
      POSTGRES_DB: trueott_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trueott-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
